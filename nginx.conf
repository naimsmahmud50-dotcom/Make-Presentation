# =========================================================================================
# 📌 APEXFLOW OS — Enterprise Hardened NGINX Configuration (v1.0.0 Gold Master)
# -----------------------------------------------------------------------------------------
# 🎯 ARCHITECTURAL ROLE:
# Production HTTP/2 server configuration delivering sub-millisecond local latency,
# military-grade security headers, offline PWA caching, and Zero-Upload Privacy enforcement.
# =========================================================================================

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Hide NGINX version string for security hardening
    server_tokens off;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # =====================================================================================
    # 🛡️ ENTERPRISE ZERO-TRUST SECURITY HEADERS
    # =====================================================================================
    # Mitigate MIME sniffing attacks
    add_header X-Content-Type-Options "nosniff" always;

    # Prevent clickjacking in legacy frame environments
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Cross-site scripting legacy filter
    add_header X-XSS-Protection "1; mode=block" always;

    # Strict Referrer policy prevents URL path leakage
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Strict Content Security Policy (Zero-Upload Privacy Guarantee)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; connect-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'self';" always;

    # Restrict device sensor capabilities to presenter scope
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), accelerometer=(), gyroscope=(), magnetometer=()" always;

    # =====================================================================================
    # 🔍 HEALTHCHECK ENDPOINT
    # =====================================================================================
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK\n";
    }

    # =====================================================================================
    # ⚡ CACHING STRATEGY: HTML VIEWS & SERVICE WORKER
    # Stale-While-Revalidate: HTML and SW must check network first for instant updates
    # =====================================================================================
    location ~* \.(html|sw\.js|manifest\.json)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # =====================================================================================
    # 📦 IMMUTABLE ASSET CACHING: JS, CSS, SVG, FONTS
    # 1-Year aggressive caching for lightning-fast 120 FPS frame initialization
    # =====================================================================================
    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # =====================================================================================
    # 🌐 ROUTING: PRESENTATION VIEWS & CLIENT APPLICATION
    # =====================================================================================
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # Explicit Presentation View Routes
    location = /stage {
        try_files /stage.html =404;
    }

    location = /war-room {
        try_files /war-room.html =404;
    }

    location = /admin {
        try_files /admin.html =404;
    }

    location = /remote {
        try_files /remote.html =404;
    }

    # Deny access to hidden files and internal directories (.git, .specify, scratch)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ^~ /scratch/ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ^~ /specs/ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
